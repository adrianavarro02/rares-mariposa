<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101812"><title>Administrador | Rares Mariposa</title><style>
:root{--bg:#101812;--panel:#19231b;--cream:#f8f3e8;--muted:#c4c9bd;--lime:#d5f36a;--line:#465046}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--cream);font:15px Arial,sans-serif}.wrap{max-width:900px;width:92%;margin:auto}header{padding:20px 0;border-bottom:1px solid var(--line)}a{color:var(--lime)}main{padding:30px 0}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin:18px 0}h1,h2{font-family:Georgia,serif}label{display:block;margin:12px 0 6px;color:var(--muted)}input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--cream)}button{padding:11px 15px;border:0;border-radius:8px;background:var(--lime);font-weight:bold;cursor:pointer;margin:8px 6px 0 0}.hidden{display:none!important}.muted{color:var(--muted)}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.entry{padding:12px;border:1px solid var(--line);border-radius:10px;margin:8px 0}.status{white-space:pre-wrap;padding:10px;background:#2c3c2b;border-radius:8px;margin-top:12px}@media(max-width:600px){.row{grid-template-columns:1fr}}
</style></head><body><header><div class="wrap"><b>✳ Rares Mariposa · Administrador</b> <span style="float:right"><a href="./index.html">Ver menú</a></span></div></header><main class="wrap"><h1>Gestiona tu menú</h1><p class="muted">Productos, precios, fotografías y promociones.</p><section id="warning" class="panel hidden"><b>Falta configurar Supabase.</b><p>Completa supabase-config.js con la URL y la clave pública del proyecto.</p></section><section id="app"><div class="panel"><button id="productsTab">Productos</button><button id="promosTab">Promociones</button><form id="productForm"><h2 id="formTitle">Añadir producto</h2><input id="pid" type="hidden"><div class="row"><div><label>Nombre</label><input id="name" required maxlength="100"></div><div><label>Precio en CUP</label><input id="price" type="number" min="0" step="1"></div><div><label>Categoría</label><select id="category"><option value="comida">Para comer</option><option value="bebidas">Bebidas</option><option value="estrella">La estrella</option></select></div><div><label>Etiqueta (opcional)</label><input id="tag" placeholder="NUEVO, PROMO…"></div></div><label>Descripción</label><textarea id="description"></textarea><label>Fotografía JPG/PNG/WebP (máx. 5 MB)</label><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"><p><label><input id="active" type="checkbox" checked style="width:auto"> Mostrar en el menú</label><label><input id="featured" type="checkbox" style="width:auto"> Destacar</label></p><button>Guardar producto</button><button type="button" id="clear">Limpiar</button></form><form id="promoForm" class="hidden"><h2>Crear promoción</h2><label>Título</label><input id="ptitle" required><label>Descripción</label><textarea id="pdesc"></textarea><label>Imagen opcional</label><input id="pphoto" type="file" accept="image/jpeg,image/png,image/webp"><div class="row"><div><label>Desde (opcional)</label><input id="pstart" type="datetime-local"></div><div><label>Hasta (opcional)</label><input id="pend" type="datetime-local"></div></div><label><input id="pactive" type="checkbox" checked style="width:auto"> Activa</label><button>Guardar promoción</button></form><div id="msg" class="status hidden"></div></div><div class="panel"><h2 id="listTitle">Productos</h2><div id="list"></div></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script><script src="./supabase-common.js"></script><script src="./admin.js"></script></body></html>
